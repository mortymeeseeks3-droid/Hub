<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Asymmetry Studio - Distortion Engine Fullscreen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;500&display=swap" rel="stylesheet">
<style>
  /* Minimalist Aesthetic - Reset & Base */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Jost', sans-serif; 
    font-weight: 200;
    background: #050505; 
    color: #eaeaea; 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
  }
  
  /* Canvas Area - Always Fullscreen */
  #art-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
  }

  #art-container svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  
  /* Floating Controls */
  .fs-controls { 
    position: absolute; 
    bottom: 32px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: rgba(10,10,10,0.85); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px);
    border: 0.5px solid rgba(255,255,255,0.1); 
    padding: 8px; 
    border-radius: 50px; 
    display: flex;
    gap: 6px; 
    z-index: 2000; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    align-items: center;
  }

  .fs-controls button, .fs-controls label.upload-btn { 
    border-radius: 30px; 
    padding: 12px 20px; 
    font-family: inherit;
    font-size: 11px; 
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 0.5px solid transparent; 
    background: transparent; 
    color: #aaa;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .fs-controls button:hover, .fs-controls label.upload-btn:hover { color: #fff; }
  .fs-controls button:active { background: rgba(255,255,255,0.1); }
  
  .fs-controls .btn-primary { 
    background: rgba(250, 204, 21, 0.08); 
    border: 0.5px solid rgba(250, 204, 21, 0.4); 
    color: #facc15; 
  }
  .fs-controls .btn-primary:hover {
    background: rgba(250, 204, 21, 0.15); 
    border-color: #facc15;
    color: #fff;
  }

  /* Size Input Fields */
  .size-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    border-left: 0.5px solid rgba(255,255,255,0.1);
    border-right: 0.5px solid rgba(255,255,255,0.1);
    height: 24px;
  }

  .size-inputs input, .size-inputs select {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 12px;
    font-family: inherit;
    font-weight: 300;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  
  .size-inputs input { width: 44px; }
  .size-inputs select { cursor: pointer; color: #facc15; }
  .size-inputs select option { background: #050505; color: #fff; }
  
  .size-inputs input:focus { color: #facc15; }
  .size-inputs input::-webkit-outer-spin-button,
  .size-inputs input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  
  .size-inputs span {
    color: #666;
    font-size: 10px;
    margin: 0 2px;
  }

  input[type="file"] { display: none; }

  @media (max-width: 850px) {
    .fs-controls { bottom: 16px; padding: 6px; gap: 4px; flex-wrap: wrap; justify-content: center; border-radius: 20px; width: 95%; }
    .fs-controls button, .fs-controls label.upload-btn { padding: 10px 14px; font-size: 10px; }
    .size-inputs { border: none; width: 100%; justify-content: center; margin-bottom: 4px; }
  }
</style>
</head>
<body>

<div id="art-container"></div>

<div class="fs-controls">
  <label class="upload-btn">
    <input type="file" id="imageUpload" accept="image/*">
    Upload
  </label>
  <button id="fsRandomBtn" class="btn-primary">Randomize</button>
  <div class="size-inputs" title="Output Dimensions & Settings">
    <input type="number" id="outW" value="1080" placeholder="W">
    <span>✕</span>
    <input type="number" id="outH" value="1080" placeholder="H">
    <select id="outUnit">
      <option value="px">px</option>
      <option value="mm">mm</option>
    </select>
    <select id="outDpi" title="Target DPI">
      <option value="72">72dpi</option>
      <option value="300">300dpi</option>
      <option value="600" selected>600dpi</option>
    </select>
  </div>
  <button id="fsSvgBtn">SVG</button>
  <button id="fsPngBtn">PNG</button>
</div>

<script>
// --- CORE UTILS & STATE ---
function getRandomNum(min, max) { return Math.random() * (max - min) + min; }

const palettes = [
    ["#99f6e4", "#8b5cf6"], ["#facc15", "#e11d48"], ["#22d3ee", "#be185d"], ["#a3e635", "#4338ca"], ["#f472b6", "#1e40af"],
    ["#34d399", "#111827"], ["#fbbf24", "#0f172a"], ["#60a5fa", "#312e81"], ["#f87171", "#171717"], ["#a78bfa", "#064e3b"],
    ["#ffffff", "#000000"], ["#ff00ff", "#00ffff"], ["#00ff00", "#ff0000"], ["#ffff00", "#0000ff"], ["#ff8800", "#0088ff"]
];

const state = {
    c1: "#99f6e4",
    c2: "#8b5cf6",
    mode: "gradient",
    imgUrl: null,
    strength: 300,
    complex: 15,
    presence: 70,
    position: "top"
};

// --- IMAGE UPLOAD LOGIC ---
document.getElementById('imageUpload').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            state.imgUrl = e.target.result; 
            
            const tempImg = new Image();
            tempImg.onload = function() {
                // Auto-push native image dimensions to UI inputs
                document.getElementById('outW').value = tempImg.naturalWidth;
                document.getElementById('outH').value = tempImg.naturalHeight;
                document.getElementById('outUnit').value = 'px';
                
                state.mode = 'image-warp';
                state.position = 'top'; 
                generateArt();
            };
            tempImg.src = state.imgUrl;
        };
        reader.readAsDataURL(file); 
    }
});

// --- GENERATION ENGINE ---
function generateFractal(x, y, length, angle, depth, color, filter) {
    if (depth === 0) return '';
    let x2 = x + length * Math.cos(angle);
    let y2 = y + length * Math.sin(angle);
    let str = `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${depth * 1.5}" filter="url(#${filter})" />`;
    str += generateFractal(x2, y2, length * getRandomNum(0.6, 0.8), angle - getRandomNum(0.2, 0.6), depth - 1, color, filter);
    str += generateFractal(x2, y2, length * getRandomNum(0.6, 0.8), angle + getRandomNum(0.2, 0.6), depth - 1, color, filter);
    return str;
}

function getDimensionsInPx() {
    const width = parseFloat(document.getElementById('outW').value) || 1080;
    const height = parseFloat(document.getElementById('outH').value) || 1080;
    const unit = document.getElementById('outUnit').value;
    const dpi = parseInt(document.getElementById('outDpi').value) || 600;

    if (unit === 'mm') {
        const scale = dpi / 25.4;
        return { w: Math.round(width * scale), h: Math.round(height * scale) };
    }
    return { w: Math.round(width), h: Math.round(height) };
}

function generateSvgContent(width, height) {
    const warpFreq = state.complex / 1000;
    const minDim = Math.min(width, height);
    const safetyDim = width * 4;

    let defs = `<defs>
        <filter id="wildTurbulence" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="fractalNoise" baseFrequency="${warpFreq}" numOctaves="3" seed="123" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="${state.strength}" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquidSwirl" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="fractalNoise" baseFrequency="${warpFreq / 2}" numOctaves="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="${state.strength * 1.2}" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="jitterGeometry" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="turbulence" baseFrequency="${warpFreq * 2}" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="${state.strength * 0.3}" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <pattern id="patGridFine" width="${minDim*0.024}" height="${minDim*0.024}" patternUnits="userSpaceOnUse">
            <path d="M ${minDim*0.024} 0 L 0 0 0 ${minDim*0.024}" fill="none" stroke="white" stroke-width="${minDim*0.002}" />
        </pattern>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${state.c1}" />
            <stop offset="100%" stop-color="${state.c2}" />
        </linearGradient>
    </defs>`;

    let body = ``;
    let imgTag = '';
    
    if (state.imgUrl && (state.mode === 'image-clean' || state.mode === 'image-warp')) {
        const imgFilter = state.mode === 'image-warp' ? 'filter="url(#wildTurbulence)"' : '';
        const imgOpacity = state.position === 'top' ? (state.presence / 100) : 1;
        imgTag = `<image href="${state.imgUrl}" x="0" y="0" width="${width}" height="${height}" preserveAspectRatio="xMidYMid slice" ${imgFilter} opacity="${imgOpacity}" />`;
    }

    if (imgTag && state.position === 'bottom') {
        const effectOverlayOpacity = (100 - state.presence) / 100;
        body += imgTag;
        body += `<rect x="0" y="0" width="${width}" height="${height}" fill="url(#bgGradient)" opacity="${effectOverlayOpacity}" style="mix-blend-mode: color;" />`;
    } else {
        body += `<rect x="0" y="0" width="${width}" height="${height}" fill="url(#bgGradient)" />`;
    }

    const bandCount = Math.floor(getRandomNum(10, 18));
    const blendModes = ['normal', 'overlay', 'color-dodge', 'hard-light'];

    for(let i = 0; i < bandCount; i++) {
        const cx = width * getRandomNum(-0.2, 1.2);
        const cy = height * getRandomNum(-0.2, 1.2);
        const angle = [0, 45, 90, 135, 180, -45][Math.floor(Math.random() * 6)];
        const spreadUp = height * getRandomNum(0.3, 1.2);
        const spreadDown = height * getRandomNum(0.3, 1.2);
        const colUp = Math.random() > 0.5 ? state.c1 : state.c2;
        const colDown = Math.random() > 0.5 ? state.c2 : state.c1;

        body += `
            <defs>
                <linearGradient id="fadeUpGrad_${i}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="white" stop-opacity="0" />
                    <stop offset="80%" stop-color="white" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="white" stop-opacity="1" />
                </linearGradient>
                <mask id="maskUp_${i}" maskUnits="userSpaceOnUse">
                    <rect x="-${safetyDim}" y="-${spreadUp}" width="${2*safetyDim}" height="${spreadUp}" fill="url(#fadeUpGrad_${i})" />
                </mask>
                <linearGradient id="fadeDownGrad_${i}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="white" stop-opacity="1" />
                    <stop offset="20%" stop-color="white" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="white" stop-opacity="0" />
                </linearGradient>
                <mask id="maskDown_${i}" maskUnits="userSpaceOnUse">
                    <rect x="-${safetyDim}" y="0" width="${2*safetyDim}" height="${spreadDown}" fill="url(#fadeDownGrad_${i})" />
                </mask>
            </defs>
        `;

        const m = blendModes[Math.floor(Math.random() * blendModes.length)];
        body += `<g transform="translate(${cx}, ${cy}) rotate(${angle})" style="mix-blend-mode: ${m};">`;
        body += `<rect x="-${safetyDim}" y="-${spreadUp}" width="${2*safetyDim}" height="${spreadUp}" fill="${colUp}" mask="url(#maskUp_${i})" opacity="0.9"/>`;
        body += `<rect x="-${safetyDim}" y="0" width="${2*safetyDim}" height="${spreadDown}" fill="${colDown}" mask="url(#maskDown_${i})" opacity="0.9"/>`;
        body += `<line x1="-${safetyDim}" y1="0" x2="${safetyDim}" y2="0" stroke="${state.c1}" stroke-width="${minDim*0.002}" opacity="0.8" />`;
        body += `</g>`;
    }

    body += `<rect x="0" y="0" width="${width}" height="${height}" fill="url(#patGridFine)" filter="url(#liquidSwirl)" opacity="0.2" style="mix-blend-mode: overlay;" />`;

    for(let k=0; k<3; k++) {
        body += `<circle cx="${width * getRandomNum(0.2, 0.8)}" cy="${height * getRandomNum(0.2, 0.8)}" r="${minDim * getRandomNum(0.2, 0.5)}" fill="${Math.random() > 0.5 ? state.c1 : state.c2}" filter="url(#liquidSwirl)" opacity="0.3" style="mix-blend-mode: color-dodge;"/>`;
    }

    for(let p=0; p<4; p++) {
        const px = width * getRandomNum(0.1, 0.9), py = height * getRandomNum(0.1, 0.9);
        const size = minDim * getRandomNum(0.1, 0.4);
        const points = `${px},${py-size} ${px+size},${py} ${px+size/2},${py+size} ${px-size/2},${py+size} ${px-size},${py}`;
        body += `<polygon points="${points}" fill="none" stroke="${Math.random() > 0.5 ? state.c1 : state.c2}" stroke-width="${minDim*0.008}" filter="url(#jitterGeometry)" opacity="0.7" />`;
    }

    const spikeCx = width * getRandomNum(0.2, 0.8), spikeCy = height * getRandomNum(0.2, 0.8);
    let spikes = `<g filter="url(#wildTurbulence)" opacity="0.9" style="mix-blend-mode: screen;">`;
    for(let s=0; s<30; s++) {
        const a = getRandomNum(0, Math.PI * 2), len = minDim * getRandomNum(0.2, 0.8);
        spikes += `<line x1="${spikeCx}" y1="${spikeCy}" x2="${spikeCx + Math.cos(a)*len}" y2="${spikeCy + Math.sin(a)*len}" stroke="${Math.random() > 0.5 ? state.c1 : state.c2}" stroke-width="${minDim * getRandomNum(0.002, 0.01)}" />`;
    }
    spikes += `</g>`;
    body += spikes;

    body += `<g opacity="0.8">`;
    body += generateFractal(width * getRandomNum(0.2, 0.8), height * getRandomNum(0.2, 0.8), minDim * getRandomNum(0.1, 0.25), -Math.PI/2, 6, Math.random() > 0.5 ? state.c1 : state.c2, 'jitterGeometry');
    body += `</g>`; 

    if (imgTag && state.position === 'top') {
        body += imgTag;
    }

    return defs + body;
}

function generateArt() {
    const container = document.getElementById('art-container');
    const dims = getDimensionsInPx(); 
    
    let svgStr = `<svg id="master-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dims.w} ${dims.h}" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">`;
    svgStr += generateSvgContent(dims.w, dims.h);
    svgStr += `</svg>`;
    container.innerHTML = svgStr;
}

// --- ACTIONS & BINDINGS ---
function randomizeState() {
    const pal = palettes[Math.floor(Math.random() * palettes.length)];
    state.c1 = pal[0];
    state.c2 = pal[1];
    state.strength = getRandomNum(100, 800);
    state.complex = getRandomNum(5, 50);
    state.presence = getRandomNum(30, 90);
    state.position = Math.random() > 0.5 ? 'top' : 'bottom';
    
    if (state.imgUrl) {
        state.mode = Math.random() > 0.3 ? 'image-warp' : 'image-clean';
    } else {
        state.mode = 'gradient';
    }
    generateArt();
}

document.getElementById('fsRandomBtn').addEventListener('click', randomizeState);

// Event listeners to update live preview when dimensions change
['outW', 'outH', 'outUnit', 'outDpi'].forEach(id => {
    document.getElementById(id).addEventListener('change', generateArt);
});

// --- EXPORT LOGIC ---
function getExportSVGString(w, h) {
    let svgStr = `<svg id="export-art" xmlns="http://www.w3.org/2000/svg" width="${w}px" height="${h}px" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">`;
    svgStr += generateSvgContent(w, h);
    svgStr += `</svg>`;
    return svgStr;
}

function triggerDownload(uri, filename) {
    const link = document.createElement('a');
    link.download = filename;
    link.href = uri;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

document.getElementById('fsSvgBtn').addEventListener('click', function() {
    const dims = getDimensionsInPx();
    const svgString = getExportSVGString(dims.w, dims.h);
    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    triggerDownload(url, `distortion_engine_${dims.w}x${dims.h}.svg`);
    setTimeout(() => URL.revokeObjectURL(url), 10);
});

document.getElementById('fsPngBtn').addEventListener('click', function() {
    const dims = getDimensionsInPx();
    const svgString = getExportSVGString(dims.w, dims.h);
    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    const img = new Image();
    img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = dims.w;
        canvas.height = dims.h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000'; 
        ctx.fillRect(0, 0, dims.w, dims.h);
        ctx.drawImage(img, 0, 0, dims.w, dims.h);
        
        const pngDataUrl = canvas.toDataURL('image/png');
        triggerDownload(pngDataUrl, `distortion_engine_${dims.w}x${dims.h}.png`);
        URL.revokeObjectURL(url);
    };
    img.src = url;
});

// Boot
randomizeState();
</script>
</body>
</html>
