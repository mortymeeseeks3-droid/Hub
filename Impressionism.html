<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Asymmetry Studio - Fullscreen</title>
<style>
  /* Minimalist Aesthetic - Reset & Base */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; 
    font-weight: 100; /* Ultra-fine thin font */
    background: #000; 
    color: #e0e0e0; 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
    letter-spacing: 0.05em;
  }
  
  /* App Layout */
  .app { 
    display: flex; 
    height: 100%; 
    width: 100%; 
    position: relative; 
  }
  
  /* Canvas Area - Always Fullscreen */
  .canvas-wrapper { 
    flex: 1; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  
  .canvas-wrapper svg { 
    width: 100%; 
    height: 100%; 
    max-width: 100%; 
    max-height: 100%; 
    display: block;
    overflow: hidden;
  }
  
  /* Floating Controls */
  .fs-controls { 
    position: absolute; 
    bottom: 32px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: rgba(10,10,10,0.85); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 255, 255, 0.2); 
    padding: 8px; 
    border-radius: 50px; 
    display: flex;
    gap: 6px; 
    z-index: 2000; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    align-items: center;
  }

  .fs-controls button { 
    border-radius: 30px; 
    padding: 12px 20px; 
    font-size: 10px; 
    font-weight: 100;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border: 1px solid transparent; 
    background: transparent; 
    color: #aaa;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .fs-controls button:hover { 
    color: #00ffff; /* Cyan glow accent */
    text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
  }
  .fs-controls button:active { background: rgba(0, 255, 255, 0.1); }
  
  .fs-controls .btn-primary { 
    background: rgba(255, 0, 255, 0.08); 
    border: 1px solid rgba(255, 0, 255, 0.3); /* Magenta accent */
    color: #fff; 
  }
  .fs-controls .btn-primary:hover {
    background: rgba(255, 0, 255, 0.15); 
    border-color: #ff00ff;
    color: #ff00ff;
    text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
  }

  /* Size Input Fields */
  .size-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    border-left: 1px solid rgba(0, 255, 255, 0.2);
    border-right: 1px solid rgba(0, 255, 255, 0.2);
    height: 24px;
  }

  .size-inputs input {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 11px;
    font-family: inherit;
    font-weight: 100;
    width: 48px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  
  .size-inputs input:focus { color: #00ffff; }
  .size-inputs input::-webkit-outer-spin-button,
  .size-inputs input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  
  .size-inputs span {
    color: #ff00ff;
    font-size: 10px;
    opacity: 0.7;
  }

  @media (max-width: 600px) {
    .fs-controls { bottom: 16px; padding: 6px; gap: 4px; }
    .fs-controls button { padding: 10px 14px; font-size: 9px; }
    .size-inputs input { width: 40px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="canvas-wrapper" id="canvas-container"></div>
  
  <div class="fs-controls">
    <button id="fsRandomBtn" class="btn-primary">Randomize</button>
    <div class="size-inputs" title="Output Dimensions (Width x Height)">
      <input type="number" id="outW" value="1080" placeholder="W">
      <span>✕</span>
      <input type="number" id="outH" value="2150" placeholder="H">
    </div>
    <button id="fsSvgBtn">SVG</button>
    <button id="fsPngBtn">PNG</button>
  </div>
</div>

<script>
// Data Configurations
const PALS = [
  { id:'monet', cat:'Impression', colors:["#54707e","#7ca6a0","#b2d1c1","#e1c6d3","#9d7b97"] },
  { id:'vg', cat:'Impression', colors:["#0b2545","#134074","#8da9c4","#eef4d4","#f4d35e"] },
  { id:'renoir', cat:'Impression', colors:["#f7d6bb","#e29578","#83c5be","#006d77","#ffddd2"] },
  { id:'degas', cat:'Impression', colors:["#e8d1dc","#c7a3b5","#f4e4c1","#8ba89f","#5b7570"] },
  { id:'acid', cat:'Modern', colors:["#99f6e4","#8b5cf6","#f472b6","#38bdf8","#fbbf24"] },
  { id:'brutalist', cat:'Modern', colors:["#1e1e24","#444140","#7a7265","#bc9a78","#fb8b24"] },
  { id:'chrome', cat:'Modern', colors:["#0f172a","#38bdf8","#818cf8","#c084fc","#e879f9"] },
  { id:'bauhaus', cat:'Modern', colors:["#111827","#f59e0b","#ef4444","#3b82f6","#e5e7eb"] },
  { id:'synthwave', cat:'Neon', colors:["#240046","#3c096c","#5a189a","#7b2cbf","#9d4edd"] },
  { id:'cyber', cat:'Neon', colors:["#050505","#00ffff","#ff007f","#7928ca","#ffaa00"] },
  { id:'plasma', cat:'Neon', colors:["#03071e","#370617","#9d0208","#dc2f02","#f48c06"] },
  { id:'laser', cat:'Neon', colors:["#000000","#140038","#410082","#8800c7","#00e5ff"] },
  { id:'sunset', cat:'Vivid', colors:["#f72585","#7209b7","#3a0ca3","#4361ee","#4cc9f0"] },
  { id:'tropical', cat:'Vivid', colors:["#ff0054","#ff5400","#ffbd00","#390099","#9e0059"] },
  { id:'peacock', cat:'Vivid', colors:["#003049","#d62828","#f77f00","#fcbf49","#eae2b7"] },
  { id:'desert', cat:'Earth', colors:["#cb997e","#eddcd2","#fff1e6","#f0efeb","#ddbea9"] },
  { id:'tuscan', cat:'Earth', colors:["#606c38","#283618","#fefae0","#dda15e","#bc6c25"] },
  { id:'sage', cat:'Earth', colors:["#cad2c5","#84a98c","#52796f","#354f52","#2f3e46"] },
  { id:'obsidian', cat:'Mono', colors:["#000000","#0f0f0f","#1f1f1f","#d4af37","#f3e5ab"] },
  { id:'mono', cat:'Mono', colors:["#000000","#1a1a1a","#404040","#808080","#bfbfbf"] },
];

const PRESETS = ['imp', 'monet', 'const', 'quantum', 'glitch', 'ethereal'];
const ANGLES = ['free', 'ortho', 'horizon', 'isometric', 'radial', 'diagonal'];

// Internal Engine State
const state = {
  pal: 'monet',
  preset: 'imp',
  angle: 'free',
  complexity: 60,
  sharp: 0.5,
  stipple: 0.6,
  brush: 1,
  bloom: 0.25,
  ripple: 0.3,
  chromatic: 0,
  w: 1080,
  h: 2150, // Default Output height set to 2150
};

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => Math.random() * (b - a) + a;

function getPalColors() {
  const p = PALS.find(x => x.id === state.pal);
  return p ? p.colors : PALS[0].colors;
}

function applyPreset(presetId) {
  state.preset = presetId;
  const settings = {
    imp: { complexity:60, sharp:0.5, stipple:0.6, brush:1, bloom:0.25, ripple:0.3 },
    monet: { complexity:110, sharp:0.15, stipple:0.85, brush:1.3, bloom:0.55, ripple:0.45 },
    const: { complexity:50, sharp:0.85, stipple:0.2, brush:1.5, bloom:0.1, ripple:0.05 },
    // Reduced maximum complexity slightly on heavy presets to assist mobile rendering
    quantum: { complexity:110, sharp:0.35, stipple:1, brush:0.8, bloom:0.4, ripple:0.2 },
    glitch: { complexity:80, sharp:0.6, stipple:0.5, brush:1, bloom:0.35, ripple:0.15, chromatic:0.3 },
    ethereal: { complexity:90, sharp:0.1, stipple:0.7, brush:1.8, bloom:0.85, ripple:0.6 },
  };
  if (settings[presetId]) Object.assign(state, settings[presetId]);
}

function renderArt() {
  const w = state.w, h = state.h;
  const cols = getPalColors();
  const c1 = cols[0], c2 = cols[1], dark = cols[cols.length-1] || '#000';

  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="overflow: hidden; max-width: 100%; max-height: 100%;">
    <defs>
      <clipPath id="canvasClip">
        <rect width="${w}" height="${h}" />
      </clipPath>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${c1}" stop-opacity="0.2"/>
        <stop offset="50%" stop-color="${dark}" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="${c2}" stop-opacity="0.2"/>
      </linearGradient>
    </defs>
    
    <g clip-path="url(#canvasClip)">
      <rect width="${w}" height="${h}" fill="${dark}"/>
      <rect width="${w}" height="${h}" fill="url(#bg)"/>
      <g>`;

  const total = Math.floor(state.complexity * 1.5);

  for (let i = 0; i < total; i++) {
    const x = rand(-w*0.1, w*1.1); 
    const y = rand(-h*0.1, h*1.1);
    let ang = 0;
    
    if (state.angle === 'ortho') ang = pick([0,90,180,270]);
    else if (state.angle === 'horizon') ang = pick([0,180,5,-5]);
    else if (state.angle === 'isometric') ang = pick([30,150,210,330]);
    else if (state.angle === 'radial') ang = Math.atan2(y-h/2, x-w/2)*180/Math.PI;
    else if (state.angle === 'diagonal') ang = pick([45,-45,135,-135]);
    else ang = rand(0, 360);

    const col = pick(cols);

    if (Math.random() < state.sharp) {
      const spread = rand(w*0.2, w*0.8);
      const hspan = rand(h*0.8, h*1.5); 
      // mix-blend-mode removed here for massive performance gain
      svg += `<g transform="translate(${x},${y}) rotate(${ang})">
        <rect x="${-spread}" y="${-hspan/2}" width="${spread}" height="${hspan}" fill="${col}" opacity="0.4"/>
        <line x1="0" y1="${-hspan/2}" x2="0" y2="${hspan/2}" stroke="${col}" stroke-width="${state.brush*1.5}" opacity="0.8"/>
      </g>`;
    } else {
      const cnt = Math.floor(10 * state.stipple);
      const rad = rand(w*0.06, w*0.20);
      // mix-blend-mode removed here for massive performance gain
      svg += `<g transform="translate(${x},${y}) rotate(${ang})">`;
      for (let k = 0; k < cnt; k++) {
        const ox = rand(-rad, rad);
        const oy = rand(-rad, rad);
        const rw = rand(10, 80*state.brush);
        const rh = rand(4, 25*state.brush);
        svg += `<ellipse cx="${ox}" cy="${oy}" rx="${rw/2}" ry="${rh/2}" fill="${pick(cols)}" opacity="${Math.random()*0.5+0.3}"/>`;
      }
      svg += `</g>`;
    }
  }

  svg += `</g></g></svg>`;
  
  // Wrap the DOM update in requestAnimationFrame for smoother browser painting
  requestAnimationFrame(() => {
    $('canvas-container').innerHTML = svg;
  });
}

// Randomizer Action
function executeRandomize() {
  state.pal = pick(PALS).id;
  state.angle = pick(ANGLES);
  applyPreset(pick(PRESETS));
  
  // Nudge complexity and brush for more variety
  state.complexity = Math.floor(state.complexity * rand(0.7, 1.3));
  state.brush = state.brush * rand(0.7, 1.3);
  
  renderArt();
}

// Handle Custom Export Dimensions 
function updateDimensions() {
  const w = parseInt($('outW').value);
  const h = parseInt($('outH').value);
  if (w >= 10 && h >= 10) {
    state.w = w;
    state.h = h;
    renderArt();
  }
}

$('outW').addEventListener('change', updateDimensions);
$('outH').addEventListener('change', updateDimensions);

// Export Files
function downloadSvg() {
  const svg = $('canvas-container').innerHTML;
  const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `asymmetry_${state.w}x${state.h}_${Date.now()}.svg`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadPng() {
  const svg = $('canvas-container').innerHTML;
  const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = state.w;
    canvas.height = state.h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, state.w, state.h);
    ctx.drawImage(img, 0, 0, state.w, state.h);
    canvas.toBlob(blob => {
      const url2 = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url2;
      a.download = `asymmetry_${state.w}x${state.h}_${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url2);
    });
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

// UI Triggers
$('fsRandomBtn').addEventListener('click', executeRandomize);
$('fsSvgBtn').addEventListener('click', downloadSvg);
$('fsPngBtn').addEventListener('click', downloadPng);

// Boot
renderArt();
</script>
</body>
</html>
