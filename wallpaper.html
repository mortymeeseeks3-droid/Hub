<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pattern Studio - Fullscreen Parametric</title>
<style>
  /* Minimalist Aesthetic - Reset & Base */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    font-weight: 300;
    background: #000000; 
    color: #f3f4f6; 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
  }
  
  /* Canvas Area - Always Fullscreen */
  .canvas-wrapper { 
    width: 100vw;
    height: 100vh;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: absolute;
    top: 0;
    left: 0;
  }
  
  #art-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }

  #art-container svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  
  /* Floating Controls */
  .fs-controls { 
    position: absolute; 
    bottom: 32px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: rgba(18, 18, 18, 0.85); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 0, 255, 0.2); 
    padding: 8px 12px; 
    border-radius: 50px; 
    display: flex;
    gap: 12px; 
    z-index: 2000; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    align-items: center;
  }

  .fs-controls button { 
    border-radius: 30px; 
    padding: 12px 20px; 
    font-family: inherit;
    font-size: 11px; 
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 1px solid transparent; 
    background: transparent; 
    color: #f3f4f6;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0.8;
  }
  .fs-controls button:hover { opacity: 1; background: rgba(255, 0, 255, 0.1); }
  .fs-controls button:active { background: rgba(255, 0, 255, 0.2); }
  
  .fs-controls .btn-primary { 
    background: rgba(255, 0, 255, 0.1); 
    border: 1px solid rgba(255, 0, 255, 0.4); 
    color: #ff00ff;
    opacity: 1;
  }
  .fs-controls .btn-primary:hover {
    background: rgba(255, 0, 255, 0.2); 
    border-color: #ff00ff;
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
  }

  /* Size Input Fields */
  .size-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    border-left: 1px solid rgba(255, 0, 255, 0.2);
    border-right: 1px solid rgba(255, 0, 255, 0.2);
    height: 24px;
  }

  .size-inputs input {
    background: transparent;
    border: none;
    color: #f3f4f6;
    font-size: 12px;
    font-family: inherit;
    font-weight: 400;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    width: 48px;
  }
  
  .size-inputs input:focus { color: #ff00ff; }
  .size-inputs input::-webkit-outer-spin-button,
  .size-inputs input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  
  .size-inputs span {
    color: rgba(243, 244, 246, 0.5);
    font-size: 10px;
    margin: 0 2px;
  }

  @media (max-width: 600px) {
    .fs-controls { bottom: 16px; padding: 10px; gap: 8px; flex-wrap: wrap; justify-content: center; border-radius: 20px; width: 95%; }
    .fs-controls button { padding: 10px 14px; font-size: 10px; }
    .size-inputs { border: none; width: 100%; justify-content: center; margin-bottom: 4px; }
  }
</style>
</head>
<body>

<div class="canvas-wrapper">
  <div id="art-container"></div>
</div>

<div class="fs-controls">
  <button id="btn-random" class="btn-primary">Randomize</button>
  
  <div class="size-inputs" title="Output Dimensions (W x H)">
    <input type="number" id="outW" value="1920" placeholder="W">
    <span>✕</span>
    <input type="number" id="outH" value="1080" placeholder="H">
  </div>
  
  <button id="btn-svg">SVG</button>
  <button id="btn-png">PNG</button>
</div>

<script>
// --- CORE UTILITIES ---
function rnd(min, max) { return Math.random() * (max - min) + min; }
function rndInt(min, max) { return Math.floor(rnd(min, max)); }
function rndHex() { return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'); }
function rndChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// --- PATTERN DICTIONARY ---
const patterns = {
  plus: `<path d="M40 20 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 v-20 h20 z" fill="currentColor"/>`,
  circles: `<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="10"/>`,
  spiderweb: `<path d="M0 0 L100 100 M100 0 L0 100 M50 0 L50 100 M0 50 L100 50" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="50" r="20" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="2" fill="none"/>`,
  waves: `<path d="M0 50 Q25 25 50 50 T100 50" stroke="currentColor" stroke-width="10" fill="none"/>`,
  checker: `<rect x="0" y="0" width="50" height="50" fill="currentColor"/><rect x="50" y="50" width="50" height="50" fill="currentColor"/>`,
  triangles: `<polygon points="50,0 100,100 0,100" fill="currentColor" opacity="0.5"/><polygon points="50,100 100,0 0,0" fill="currentColor" opacity="0.5"/>`,
  diagonal: `<line x1="0" y1="0" x2="100" y2="100" stroke="currentColor" stroke-width="10"/><line x1="100" y1="0" x2="0" y2="100" stroke="currentColor" stroke-width="10"/>`,
  dots: `<circle cx="20" cy="20" r="10" fill="currentColor"/><circle cx="80" cy="80" r="10" fill="currentColor"/>`,
  hex: `<polygon points="50,5 95,28 95,72 50,95 5,72 5,28" fill="none" stroke="currentColor" stroke-width="5"/>`,
  isometric: `<path d="M50 0 L100 25 L50 50 L0 25 Z" fill="currentColor" opacity="0.7"/><path d="M100 25 L100 75 L50 100 L50 50 Z" fill="currentColor" opacity="0.5"/><path d="M0 25 L50 50 L50 100 L0 75 Z" fill="currentColor" opacity="0.3"/>`,
  maze: `<path d="M0 25 h50 v50 h50 M25 0 v50 h-25 M75 100 v-50 h25" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="square"/>`,
  houndstooth: `<path d="M0,0 L50,50 L0,100 Z M50,50 L100,100 L100,0 Z M25,75 L75,25" stroke="currentColor" stroke-width="12" fill="none"/>`,
  hypnotic: `<g fill="none" stroke="currentColor" stroke-width="6"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="25"/><circle cx="50" cy="50" r="10"/></g>`,
  celtic: `<circle cx="35" cy="35" r="25" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="65" cy="65" r="25" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="65" cy="35" r="25" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="35" cy="65" r="25" fill="none" stroke="currentColor" stroke-width="6"/>`,
  arrows: `<path d="M20 50 L80 50 M60 30 L80 50 L60 70" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`
};

const patternKeys = Object.keys(patterns);

// --- STATE MANAGEMENT ---
const state = {
    bg: '#000000',
    scale: 100,
    l1: { pat: 'plus', col: '#ff00ff' },
    l2: { pat: 'none', col: '#00ffff' },
    blend: 'normal',
    weight: 0,
    dash: 0,
    cap: 'butt',
    join: 'miter',
    w: 1920,
    h: 1080
};

// --- DRAWING LOGIC ---
function generateSvgContent() {
    let extraStyle = `.pat * { `;
    if (state.weight > 0) extraStyle += `stroke-width: ${state.weight}px !important; `;
    if (state.dash) extraStyle += `stroke-dasharray: ${state.dash} !important; `;
    if (state.cap !== 'butt') extraStyle += `stroke-linecap: ${state.cap} !important; `;
    if (state.join !== 'miter') extraStyle += `stroke-linejoin: ${state.join} !important; `;
    extraStyle += `}`;

    let svgStr = `<defs><style>${extraStyle}</style>`;
    
    svgStr += `<pattern id="p1" width="${state.scale}" height="${state.scale}" patternUnits="userSpaceOnUse" viewBox="0 0 100 100">
        <g color="${state.l1.col}" class="pat">${patterns[state.l1.pat]}</g>
    </pattern>`;

    if (state.l2.pat !== 'none') {
        svgStr += `<pattern id="p2" width="${state.scale}" height="${state.scale}" patternUnits="userSpaceOnUse" viewBox="0 0 100 100">
            <g color="${state.l2.col}" class="pat">${patterns[state.l2.pat]}</g>
        </pattern>`;
    }

    svgStr += `</defs>`;
    
    svgStr += `<rect width="100%" height="100%" fill="${state.bg}"/>`;
    svgStr += `<rect width="100%" height="100%" fill="url(#p1)"/>`;
    
    if (state.l2.pat !== 'none') {
        svgStr += `<rect width="100%" height="100%" fill="url(#p2)" style="mix-blend-mode: ${state.blend};"/>`;
    }

    return svgStr;
}

function renderArt() {
    const container = document.getElementById('art-container');
    let svgStr = `<svg id="master-art" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">`;
    svgStr += generateSvgContent();
    svgStr += `</svg>`;
    container.innerHTML = svgStr;
}

// --- GENERATOR LOGIC ---
function randomizeArt() {
    state.bg = Math.random() > 0.4 ? '#050505' : rndHex();
    state.scale = rndInt(30, 250);
    state.l1.pat = rndChoice(patternKeys);
    state.l1.col = rndHex();
    
    if (Math.random() > 0.3) {
        state.l2.pat = rndChoice(patternKeys);
        state.l2.col = rndHex();
        state.blend = rndChoice(['normal', 'multiply', 'screen', 'overlay', 'color-dodge', 'difference']);
    } else {
        state.l2.pat = 'none';
        state.blend = 'normal';
    }

    state.weight = Math.random() > 0.7 ? rndInt(1, 15) : 0;
    state.dash = Math.random() > 0.7 ? `${rndInt(2,15)}, ${rndInt(2,15)}` : 0;
    state.cap = rndChoice(['butt', 'round', 'square']);
    state.join = rndChoice(['miter', 'round', 'bevel']);
    
    renderArt();
}

// --- EXPORT & INTERACTION LOGIC ---
const updateDims = () => {
    state.w = parseInt(document.getElementById('outW').value) || 1920;
    state.h = parseInt(document.getElementById('outH').value) || 1080;
};
document.getElementById('outW').addEventListener('change', updateDims);
document.getElementById('outH').addEventListener('change', updateDims);

function getExportSVGString() {
    let svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${state.w}px" height="${state.h}px" viewBox="0 0 ${state.w} ${state.h}">`;
    svgStr += generateSvgContent();
    svgStr += `</svg>`;
    return svgStr;
}

const saveSVG = () => {
    const svgString = getExportSVGString();
    const blob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `PatternStudio_${state.w}x${state.h}_${Date.now()}.svg`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 100);
};

const savePNG = () => {
    const canvas = document.createElement('canvas');
    canvas.width = state.w; 
    canvas.height = state.h;
    const ctx = canvas.getContext('2d');
    
    const img = new Image();
    const svgString = getExportSVGString();
    const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    
    img.onload = () => {
        ctx.drawImage(img, 0, 0, state.w, state.h);
        const pngUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = pngUrl;
        link.download = `PatternStudio_${state.w}x${state.h}_${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    };
    img.src = url;
};

document.getElementById('btn-random').addEventListener('click', randomizeArt);
document.getElementById('btn-svg').addEventListener('click', saveSVG);
document.getElementById('btn-png').addEventListener('click', savePNG);

// Boot
randomizeArt();
</script>
</body>
</html>
